name: Bug Report
description: Report an issue or unexpected trajectory calculation in RangeStudio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with **RangeStudio**!

  - type: input
    id: app_version
    attributes:
      label: RangeStudio Version
      description: Found in the bottom status bar or header (e.g. v1.0.0).
      placeholder: "e.g. v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System / Browser
      description: What platform/browser are you using?
      options:
        - "macOS (Safari / Chrome)"
        - "Windows 10 / 11 (Chrome / Edge)"
        - "Linux (Firefox / Chromium)"
        - "Mobile (iOS / Android Browser)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: Clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Select cartridge profile '6.5 Creedmoor'
        2. Set target range to 1,000 yards and crosswind to 10 mph
        3. Observe reticle holdover display
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
